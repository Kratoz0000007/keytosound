server:
  port: 8080

spring:
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities agree
      # with it, and fails loudly at startup when they do not.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO
