# Active only under spring-boot:run (see the spring-boot-maven-plugin block in
# pom.xml). Tests never load it, so they keep a throwaway database.
keytosound:
  db:
    # Relative to the backend/ directory spring-boot:run runs from.
    data-dir: .pgdata
  auth:
    # Dev only. Anyone holding this value can mint sessions, so a real
    # deployment supplies its own through KEYTOSOUND_AUTH_SECRET.
    secret: dev-only-secret-change-me-0123456789abcdef
    # Plain http on localhost; some browsers drop a Secure cookie there.
    cookie-secure: false
